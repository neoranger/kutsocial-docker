services:
  app:
    build: .
    container_name: kutsocial_app
    restart: unless-stopped
    environment:
      KUTSOCIAL_DOMAIN: ${KUTSOCIAL_DOMAIN:-localhost}
    volumes:
      - ./kutsocial:/var/www/html
      - kutsocial_data:/var/www/html/data

  worker:
    build: .
    container_name: kutsocial_worker
    restart: unless-stopped
    command: sh -c "while true; do php /var/www/html/cron.php; sleep 60; done"
    environment:
      KUTSOCIAL_DOMAIN: ${KUTSOCIAL_DOMAIN:-localhost}
    volumes:
      - ./kutsocial:/var/www/html
      - kutsocial_data:/var/www/html/data
    depends_on:
      app:
        condition: service_healthy

  web:
    build: ./nginx
    container_name: kutsocial_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./kutsocial:/var/www/html:ro
      - kutsocial_data:/var/www/html/data:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  kutsocial_data:
